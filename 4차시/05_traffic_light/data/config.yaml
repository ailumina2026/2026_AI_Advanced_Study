# Traffic Light Detection Dataset Configuration for YOLO
# Source: https://huggingface.co/datasets/YYdream/traffic_light_data

path: ../data  # dataset root dir
train: train/images  # train images (relative to 'path')
val: val/images    # val images (relative to 'path')
test: test/images  # test images (relative to 'path')

# Classes (3개 신호등 클래스)
nc: 3
names:
  0: green    # 초록불 - 진행 (GO)
  1: red      # 빨간불 - 정지 (STOP)
  2: yellow   # 노란불 - 서행 (CAUTION)
